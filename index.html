<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>架空都市「駒洋市」作品アーカイブマップ</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet & MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-dark: rgba(18, 22, 28, 0.88);
      --bg-card: rgba(30, 41, 59, 0.96);
      --border-light: rgba(255, 255, 255, 0.15);
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --font-family: 'Noto Sans JP', sans-serif;
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      background-color: #0f172a;
      color: var(--text-main);
      touch-action: manipulation;
    }

    #map { width: 100%; height: 100%; background-color: #111827; }

    /* PC / タブレット用ヘッダー */
    .app-header {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .app-header::-webkit-scrollbar { display: none; }

    .app-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600;
      letter-spacing: 1px;
      padding-right: 12px;
      border-right: 1px solid var(--border-light);
      white-space: nowrap; color: #fff;
    }

    .filter-group { display: flex; gap: 6px; align-items: center; }

    .filter-btn, .header-action-btn {
      border: 1px solid transparent;
      padding: 8px 14px; border-radius: 20px;
      cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub); white-space: nowrap;
    }

    .header-action-btn {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }
    .header-action-btn:hover { background: rgba(245, 158, 11, 0.3); }

    .filter-btn:active { transform: scale(0.96); }
    .filter-btn.active { color: #fff; border-color: rgba(255, 255, 255, 0.3); }

    .filter-btn[data-circle="all"].active { background: #334155; }
    .filter-btn[data-circle="geography"].active { background: #d97706; }
    .filter-btn[data-circle="art"].active { background: #e11d48; }
    .filter-btn[data-circle="calligraphy"].active { background: #475569; }
    .filter-btn[data-circle="photo"].active { background: #0284c7; }
    .filter-btn[data-circle="literature"].active { background: #059669; }

    /* サイドバー */
    .sidebar {
      position: fixed;
      top: 0; left: -100%;
      width: 100%; max-width: 360px; height: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-light);
      z-index: 1500;
      transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.open { left: 0; }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar-title { font-size: 18px; font-weight: 700; color: #fff; margin: 0; }
    .sidebar-close {
      border: none; background: rgba(255,255,255,0.1);
      width: 36px; height: 36px; border-radius: 50%;
      color: #fff; cursor: pointer; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }

    .sidebar-search { padding: 12px 16px; border-bottom: 1px solid var(--border-light); }
    .sidebar-search input {
      width: 100%; padding: 10px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-light);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none;
    }

    .sidebar-content {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .work-item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px; cursor: pointer;
    }
    .work-item-card:active { background: rgba(255,255,255,0.15); }
    .work-item-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .work-item-author { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }

    /* 座標インフォ */
    .coord-info {
      position: absolute; bottom: 20px; left: 20px; z-index: 1000;
      background: var(--bg-dark); backdrop-filter: blur(8px);
      border: 1px solid var(--border-light);
      color: var(--text-sub); padding: 6px 12px; border-radius: 20px;
      font-family: monospace; font-size: 11px; pointer-events: none;
    }

    /* 共通モーダルデザイン */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 2000; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #1e293b; border: 1px solid var(--border-light);
      width: 100%; max-width: 720px; max-height: 88vh;
      border-radius: 20px; overflow-y: auto; padding: 28px;
      position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      -webkit-overflow-scrolling: touch;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; border: none;
      background: rgba(255,255,255,0.1); width: 38px; height: 38px;
      border-radius: 50%; color: #fff; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }

    /* ★改善ポイント: モーダル内画像の適正表示＆サムネイル化 */
    .modal-image-wrapper {
      position: relative;
      width: 100%;
      margin: 14px 0 20px 0;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: zoom-in;
    }
    .modal-image-wrapper img {
      max-width: 100%;
      max-height: 280px; /* 画像が大きくなりすぎないよう制限 */
      object-fit: contain;
      vertical-align: middle;
      transition: transform 0.2s ease;
    }
    .modal-image-wrapper:hover img {
      transform: scale(1.02);
    }
    .image-zoom-hint {
      position: absolute;
      bottom: 8px; right: 10px;
      background: rgba(0,0,0,0.65);
      color: #fff; font-size: 11px; font-weight: 500;
      padding: 3px 8px; border-radius: 12px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    /* ★全画面ライトボックス（画像拡大表示） */
    .lightbox-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 3000;
      justify-content: center; align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-image {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      animation: lightboxFade 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes lightboxFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-body-text { font-size: 15px; line-height: 1.9; color: #e2e8f0; white-space: pre-wrap; }

    /* 概要モーダル */
    .city-about-nav {
      display: flex; gap: 8px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border-light); padding-bottom: 12px;
    }
    .city-tab-btn {
      background: none; border: none; color: var(--text-sub);
      font-size: 14px; font-weight: 700; padding: 8px 14px;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .city-tab-btn.active { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .city-tab-content { display: none; }
    .city-tab-content.active { display: block; }

    .about-prologue {
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid var(--accent-gold);
      padding: 16px; border-radius: 0 12px 12px 0;
      font-size: 15px; line-height: 1.8; color: #f3f4f6;
      margin-bottom: 24px;
    }

    .timeline-container { position: relative; padding-left: 20px; margin-top: 16px; }
    .timeline-container::before {
      content: ''; position: absolute; left: 6px; top: 0; bottom: 0;
      width: 2px; background: rgba(255,255,255,0.15);
    }
    .timeline-item { position: relative; margin-bottom: 20px; }
    .timeline-item::before {
      content: ''; position: absolute; left: -18px; top: 6px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold);
    }
    .timeline-text { font-size: 14px; line-height: 1.7; color: #e2e8f0; }

    .monument-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .monument-card {
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 16px;
    }
    .monument-card-title { font-size: 15px; font-weight: 700; color: #fcd34d; margin-bottom: 6px; }
    .monument-card-desc { font-size: 13px; line-height: 1.6; color: #cbd5e1; }

    /* ピンデザイン */
    .custom-pin-spot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 12px rgba(0,0,0,0.6); }
    .custom-pin-official {
      width: 36px; height: 36px; background: #f59e0b; border: 2px solid #fff;
      border-radius: 8px; transform: rotate(45px); box-shadow: 0 0 18px rgba(245, 158, 11, 0.9);
      display: flex; align-items: center; justify-content: center;
    }
    .custom-pin-official::after { content: '🏛️'; font-size: 20px; transform: rotate(-45px); }

    .pin-geography { background: #d97706; }
    .pin-art { background: #e11d48; }
    .pin-calligraphy { background: #64748b; }
    .pin-photo { background: #0284c7; }
    .pin-literature { background: #059669; }

    @media (max-width: 768px) {
      .app-header { top: auto; bottom: calc(12px + var(--safe-area-bottom)); border-radius: 30px; padding: 6px 12px; width: 92vw; }
      .app-title { font-size: 15px; padding-right: 8px; }
      .filter-btn, .header-action-btn { font-size: 12px; padding: 6px 12px; }
      .coord-info { top: 12px; bottom: auto; left: 12px; font-size: 10px; }
      .modal-card { padding: 20px; border-radius: 16px; max-height: 85vh; }
      .modal-image-wrapper img { max-height: 200px; } /* スマホではコンパクトに */
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="header-action-btn" id="cityAboutBtn">ℹ️ 駒洋市とは</button>
    <button class="header-action-btn" id="sidebarToggleBtn" style="background: rgba(255,255,255,0.08); color: var(--text-sub); border-color: transparent;">📋 目次</button>
    <div class="app-title">駒洋市</div>
    <div class="filter-group">
      <button class="filter-btn active" data-circle="all">すべて</button>
      <button class="filter-btn" data-circle="geography">🗺️ 地理研</button>
      <button class="filter-btn" data-circle="art">🎨 美術</button>
      <button class="filter-btn" data-circle="calligraphy">🖌️ 書道</button>
      <button class="filter-btn" data-circle="photo">📷 写真</button>
      <button class="filter-btn" data-circle="literature">📚 文芸</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 class="sidebar-title">作品・スポット目次</h3>
      <button class="sidebar-close" id="sidebarCloseBtn">&times;</button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="sidebarSearchInput" placeholder="タイトルや作者名で検索...">
    </div>
    <div class="sidebar-content" id="sidebarListContent"></div>
  </aside>

  <div class="coord-info" id="coordDisplay">タップ位置の座標</div>
  <div id="map"></div>

  <!-- 作品詳細モーダル -->
  <div class="modal-overlay" id="workModal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBadge" class="popup-badge">CIRCLE</div>
      <h2 id="modalTitle" style="font-size: 22px; margin: 6px 0 4px 0; color:#fff;">タイトル</h2>
      <div id="modalAuthor" style="font-size: 13px; color: var(--text-sub); margin-bottom: 12px;">作者名</div>
      
      <!-- モーダル内画像（クリックで拡大可能） -->
      <div class="modal-image-wrapper" id="modalImageWrapper" style="display: none;">
        <img id="modalImage" src="" alt="作品画像">
        <div class="image-zoom-hint">🔍 タップで拡大</div>
      </div>
      
      <div class="modal-body-text" id="modalBody">本文</div>
    </div>
  </div>

  <!-- ★全画面拡大表示用ライトボックス -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <img class="lightbox-image" id="lightboxImage" src="" alt="作品拡大画像">
  </div>

  <!-- 駒洋市 概要モーダル -->
  <div class="modal-overlay" id="cityAboutModal">
    <div class="modal-card">
      <button class="modal-close" id="cityAboutClose">&times;</button>
      <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 24px; color: #fcd34d; margin: 0 0 16px 0;">KOMANADA CITY GUIDE</h2>
      
      <div class="city-about-nav">
        <button class="city-tab-btn active" data-tab="tab-overview">🗺️ 都市概要・沿革</button>
        <button class="city-tab-btn" data-tab="tab-monuments">🏛️ 主要モニュメント</button>
      </div>

      <div class="city-tab-content active" id="tab-overview">
        <div class="about-prologue" id="aboutPrologueText">（読み込み中...）</div>
        <h4 style="font-size: 16px; color: #fcd34d; margin: 20px 0 12px 0;">歴史・沿革</h4>
        <div class="timeline-container" id="aboutTimeline"></div>
      </div>

      <div class="city-tab-content" id="tab-monuments">
        <div class="monument-grid" id="aboutMonuments"></div>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_WORKS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCkO4YnsI6F-tTZ1B2fCSSokJjqD_vWaNjWN0T5455EyKbRjJIrI7Lrd45wduE4HIKBHl_ND5G-017/pub?output=csv";
    const SPREADSHEET_ABOUT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCkO4YnsI6F-tTZ1B2fCSSokJjqD_vWaNjWN0T5455EyKbRjJIrI7Lrd45wduE4HIKBHl_ND5G-017/pub?output=csv";

    const imageWidth = 2300;
    const imageHeight = 1300;
    const bounds = [[0, 0], [imageHeight, imageWidth]];

    const map = L.map('map', {
      crs: L.CRS.Simple, minZoom: -2, maxZoom: 2, zoomControl: false, tap: true
    });

    L.imageOverlay('komanada-map.jpg', bounds).addTo(map);
    map.fitBounds(bounds);

    const markersClusterGroup = L.markerClusterGroup({
      disableClusteringAtZoom: 1, spiderfyOnMaxZoom: true, showCoverageOnHover: false, maxClusterRadius: 35
    });
    map.addLayer(markersClusterGroup);

    const officialMarkersLayer = L.layerGroup().addTo(map);

    let globalWorksData = [];
    let currentFilterCircle = "all";

    function normalizeCircle(input) {
      if (!input) return "geography";
      const str = input.toString();
      if (str.includes("地理")) return "geography";
      if (str.includes("美術")) return "art";
      if (str.includes("書道")) return "calligraphy";
      if (str.includes("写真")) return "photo";
      if (str.includes("文芸")) return "literature";
      return "geography";
    }

    function formatImageUrl(url) {
      if (!url) return "";
      if (url.includes("drive.google.com")) {
        const fileIdMatch = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
        if (fileIdMatch && fileIdMatch[1]) {
          return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
        }
      }
      return url;
    }

    function createCustomIcon(circleKey, isOfficial) {
      if (isOfficial) {
        return L.divIcon({
          className: 'custom-pin-container',
          html: `<div class="custom-pin-official" title="公式モニュメント"></div>`,
          iconSize: [36, 36], iconAnchor: [18, 18]
        });
      } else {
        return L.divIcon({
          className: 'custom-pin-container',
          html: `<div class="custom-pin-spot pin-${circleKey}"></div>`,
          iconSize: [26, 26], iconAnchor: [13, 13]
        });
      }
    }

    function loadDataFromSpreadsheet() {
      if (!SPREADSHEET_WORKS_CSV_URL || SPREADSHEET_WORKS_CSV_URL.includes("ここに")) {
        console.warn("スプレッドシートURL未設定のためデモデータで動作中");
        globalWorksData = [
          { circle: "地理学研究会", title: "駒洋市役所 本庁舎", author: "地理学研究会", posY: 750, posX: 1000, facilityType: "公式モニュメント", shortDesc: "歴史的近代建築。", imageUrl: "", fullContent: "駒洋市の行政の中心地。" },
          { circle: "美術部", title: "市役所前広場『駒草』", author: "駒沢 太郎", posY: 720, posX: 1050, facilityType: "通常スポット", shortDesc: "絵画作品。", imageUrl: "https://picsum.photos/id/1015/1200/800", fullContent: "絵画作品の長文説明。" }
        ];
        renderMarkers("all");
        renderDemoAboutData();
        return;
      }

      Papa.parse(SPREADSHEET_WORKS_CSV_URL, {
        download: true, header: true,
        complete: function(results) {
          globalWorksData = results.data.filter(row => row.title);
          renderMarkers("all");
        }
      });

      if (SPREADSHEET_ABOUT_CSV_URL && !SPREADSHEET_ABOUT_CSV_URL.includes("ここに")) {
        Papa.parse(SPREADSHEET_ABOUT_CSV_URL, {
          download: true, header: true,
          complete: function(results) { parseAndRenderAboutData(results.data); }
        });
      } else {
        renderDemoAboutData();
      }
    }

    function renderDemoAboutData() {
      document.getElementById('aboutPrologueText').innerText = "駒洋市（こうようし）は、旧市街の重厚な歴史と、川沿いの穏やかな自然、そして近代的な駅前風景が共存する架空の都市です。地理学研究会が設定したこの都市を舞台に、各文化系サークルが作品を展開しています。";
      document.getElementById('aboutTimeline').innerHTML = `
        <div class="timeline-item"><div class="timeline-text"><b>【1920年】駒洋電鉄の開通</b><br>駅周辺の開発が進み、商業の都市として発展を始める。</div></div>
        <div class="timeline-item"><div class="timeline-text"><b>【1955年】駒洋川護岸整備と公園造成</b><br>市民の憩いの場として川沿いが整備され、文化人が集うエリアに。</div></div>
      `;
      document.getElementById('aboutMonuments').innerHTML = `
        <div class="monument-card"><div class="monument-card-title">🏛️ 駒洋市役所 旧本庁舎</div><div class="monument-card-desc">昭和初期に建てられた石造りの近代建築。街のシンボル。</div></div>
        <div class="monument-card"><div class="monument-card-title">🌉 駒洋大橋</div><div class="monument-card-desc">旧市街と新市街を繋ぐ赤レンガ作りの橋。</div></div>
      `;
    }

    function parseAndRenderAboutData(data) {
      let prologue = "";
      let timelineHtml = "";
      let monumentsHtml = "";

      data.forEach(row => {
        const key = (row.key || "").trim();
        const val = row.value || "";
        if (key === "overview") prologue = val;
        else if (key.startsWith("history")) timelineHtml += `<div class="timeline-item"><div class="timeline-text">${val}</div></div>`;
        else if (key.startsWith("monument")) monumentsHtml += `<div class="monument-card"><div class="monument-card-desc">${val}</div></div>`;
      });

      if (prologue) document.getElementById('aboutPrologueText').innerText = prologue;
      if (timelineHtml) document.getElementById('aboutTimeline').innerHTML = timelineHtml;
      if (monumentsHtml) document.getElementById('aboutMonuments').innerHTML = monumentsHtml;
    }

    function renderMarkers(selectedCircle = "all") {
      currentFilterCircle = selectedCircle;
      markersClusterGroup.clearLayers();
      officialMarkersLayer.clearLayers();

      globalWorksData.forEach((work, idx) => {
        const circleKey = normalizeCircle(work.circle);
        if (selectedCircle !== "all" && circleKey !== selectedCircle) return;

        const y = parseFloat(work.posY);
        const x = parseFloat(work.posX);
        if (isNaN(y) || isNaN(x)) return;

        const circleName = getCircleName(circleKey);
        const workId = work.timestamp || idx;
        const isOfficial = work.facilityType && (work.facilityType.includes("公式") || work.facilityType.includes("official"));

        const popupContent = `
          <div style="padding: 4px;">
            <span class="popup-badge badge-${circleKey}">${circleName}</span>
            <div class="popup-title">${work.title}</div>
            <div class="popup-author">by ${work.author}</div>
            <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 4px;">${work.shortDesc || ''}</div>
            <button class="popup-btn" onclick="openModal('${workId}')">📖 詳細を閲覧</button>
          </div>
        `;

        const marker = L.marker([y, x], {
          icon: createCustomIcon(circleKey, isOfficial),
          zIndexOffset: isOfficial ? 1000 : 0
        });
        marker.bindPopup(popupContent);

        if (isOfficial) officialMarkersLayer.addLayer(marker);
        else markersClusterGroup.addLayer(marker);
      });

      updateSidebarList();
    }

    function updateSidebarList() {
      const listContainer = document.getElementById('sidebarListContent');
      const searchText = document.getElementById('sidebarSearchInput').value.toLowerCase();
      listContainer.innerHTML = "";

      globalWorksData.forEach((work, idx) => {
        const circleKey = normalizeCircle(work.circle);
        if (currentFilterCircle !== "all" && circleKey !== currentFilterCircle) return;

        const title = work.title || "";
        const author = work.author || "";
        if (searchText && !title.toLowerCase().includes(searchText) && !author.toLowerCase().includes(searchText)) {
          return;
        }

        const workId = work.timestamp || idx;
        const circleName = getCircleName(circleKey);

        const card = document.createElement('div');
        card.className = 'work-item-card';
        card.innerHTML = `
          <span class="popup-badge badge-${circleKey}">${circleName}</span>
          <div class="work-item-title">${title}</div>
          <div class="work-item-author">by ${author}</div>
          <div style="font-size: 11px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${work.shortDesc || ''}</div>
        `;

        card.addEventListener('click', () => focusAndOpenWork(work, workId));
        listContainer.appendChild(card);
      });
    }

    function focusAndOpenWork(work, workId) {
      const y = parseFloat(work.posY);
      const x = parseFloat(work.posX);
      if (!isNaN(y) && !isNaN(x)) map.flyTo([y, x], 1, { duration: 1.2 });
      openModal(workId);
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
    }

    function getCircleName(circleKey) {
      const names = { geography: "地理研", art: "美術部", calligraphy: "書道部", photo: "写真部", literature: "文芸部" };
      return names[circleKey] || circleKey;
    }

    // 作品詳細モーダル
    const modal = document.getElementById('workModal');
    const modalImageWrapper = document.getElementById('modalImageWrapper');
    const modalImage = document.getElementById('modalImage');

    function openModal(workId) {
      const work = globalWorksData.find((w, idx) => String(w.timestamp || idx) === String(workId));
      if (!work) return;

      const circleKey = normalizeCircle(work.circle);
      const badge = document.getElementById('modalBadge');
      badge.innerText = getCircleName(circleKey);
      badge.className = `popup-badge badge-${circleKey}`;

      document.getElementById('modalTitle').innerText = work.title;
      document.getElementById('modalAuthor').innerText = `作者: ${work.author}`;
      document.getElementById('modalBody').innerText = work.fullContent || work.shortDesc;

      const formattedImgUrl = formatImageUrl(work.imageUrl);
      if (formattedImgUrl && formattedImgUrl.trim() !== "") {
        modalImage.src = formattedImgUrl;
        modalImageWrapper.style.display = "block";
      } else {
        modalImageWrapper.style.display = "none";
        modalImage.src = "";
      }

      modal.classList.add('open');
    }

    document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    // ★ライトボックス（画像拡大表示）処理
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImage = document.getElementById('lightboxImage');

    modalImageWrapper.addEventListener('click', () => {
      if (modalImage.src) {
        lightboxImage.src = modalImage.src;
        lightboxOverlay.classList.add('open');
      }
    });

    lightboxOverlay.addEventListener('click', () => {
      lightboxOverlay.classList.remove('open');
    });

    // 駒洋市 概要モーダル制御
    const cityAboutModal = document.getElementById('cityAboutModal');
    document.getElementById('cityAboutBtn').addEventListener('click', () => cityAboutModal.classList.add('open'));
    document.getElementById('cityAboutClose').addEventListener('click', () => cityAboutModal.classList.remove('open'));
    cityAboutModal.addEventListener('click', (e) => { if (e.target === cityAboutModal) cityAboutModal.classList.remove('open'); });

    document.querySelectorAll('.city-tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.city-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.city-tab-content').forEach(c => c.classList.remove('active'));

        e.target.classList.add('active');
        const tabId = e.target.getAttribute('data-tab');
        document.getElementById(tabId).classList.add('active');
      });
    });

    // サイドバー制御
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebarToggleBtn').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('sidebarCloseBtn').addEventListener('click', () => sidebar.classList.remove('open'));
    document.getElementById('sidebarSearchInput').addEventListener('input', updateSidebarList);

    map.on('click', function(e) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);
      document.getElementById('coordDisplay').innerHTML = `posY: <b>${y}</b> / posX: <b>${x}</b>`;
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderMarkers(e.target.getAttribute('data-circle'));
      });
    });

    loadDataFromSpreadsheet();
  </script>
</body>
</html>
